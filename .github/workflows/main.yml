# =============================================================================
# 云编译 keke-Padavan 固件（MT7620 / MT7621 / MT7628，含 4.1 / 5.0.4.0 无线驱动）
# 支持在页面上选机型 + 选插件 + 选是否集成蒲公英(pgyvpn)
#
# 用法：
#   1) 本文件放到仓库的 .github/workflows/walterpandavan.yml
#   2) 仓库根目录保留 pgyvpn-ci.tar.gz（已上传，不要解压）
#   3) Actions -> 云编译 keke-Padavan -> Run workflow
#      选机型 / 插件 / 蒲公英 -> 等 40~90 分钟 -> 到 Artifacts 下载 trx
#
# 说明：
#   - 机型下拉框里的名字 = trunk/configs/templates/<机型>.config，
#     仓库新增机型后自己往 options 里加一行即可。
#   - HC5661 直接用仓库自带的配置：它是 MT7620A、128MB RAM、单频 2.4G
#     （board.h 里 GPIO 12/9/11 按 DTS 写的），不需要从别的机型派生。
#     仓库里的 HC5661A 是 MT7628 + 4.1 驱动，两者 SoC 不同，不能互相套。
#   - 所有插件开关最后都落到 .config 的 CONFIG_FIRMWARE_INCLUDE_xxx=y/n，
#     再以 `build_firmware_modify <机型> 0` 编译（第二参数传 0 表示不再套用
#     源码里写死的那套插件默认值，完全按本次选择走）。
#   - 蒲公英走 pgyvpn-ci.tar.gz 里的 apply.sh：给源码树铺
#     trunk/user/pgyvpn、改 user/Makefile / build_firmware_modify /
#     dev_init.sh，并把页面挂到「穿透服务」组（组索引自动探测，菜单标题走
#     <#menu5_30#> 多语言标签）。插件本体约 6MB（musl loader + openssl/libstdc++）。
#   - 插件越多固件越大：8MB flash 的机型（MI-3/MI-MINI/PSG1218 等）
#     建议只选 SS+SSOBFS 并关掉蒲公英；16MB 以上才扛得住全家桶。
#   - Xray / V2Ray 是 Go 源码现场编译，最慢也最容易被上游影响，按需再开。
# =============================================================================

name: 云编译 keke-Padavan

on:
  workflow_dispatch:
    inputs:
      model:
        description: '机型（须与 trunk/configs/templates/ 下同名）'
        type: choice
        required: true
        default: 'B70'
        options:
          - '360P2'
          - '5K-W20'
          - 'A3004NS'
          - 'B70'
          - 'BELL-A-040W-Q'
          - 'CR660x'
          - 'D12G'
          - 'DIR-878'
          - 'DIR-882'
          - 'E8820V2'
          - 'HC5661'
          - 'HC5661A'
          - 'HC5761A'
          - 'HC5861B'
          - 'JCG-836PRO'
          - 'JCG-AC860M'
          - 'JCG-Q20'
          - 'JCG-Y2'
          - 'K2P'
          - 'K2P_nano'
          - 'K2P-USB'
          - 'MI-3'
          - 'MI-3C'
          - 'MI-MINI'
          - 'MI-NANO'
          - 'MI-R3G'
          - 'MI-R3P'
          - 'MI-R3P-breed'
          - 'MI-R4A'
          - 'MR2600'
          - 'MSG1500'
          - 'MSG1500-7615'
          - 'MZ-R13'
          - 'MZ-R13P'
          - 'NETGEAR-BZV'
          - 'NETGEAR-CHJ'
          - 'NEWIFI3'
          - 'NEWIFI-MINI'
          - 'OYE-001'
          - 'PSG1208'
          - 'PSG1218'
          - 'PSG1218_nano'
          - 'R2100'
          - 'R6220'
          - 'RM2100'
          - 'RT-AC1200GU'
          - 'RT-AC85P'
          - 'WDR7300'
          - 'WR1200JS'
          - 'XY-C1'
          - 'ZTE_E8820S'
      pgyvpn:
        description: '集成蒲公英 pgyvpn（约 6MB，依赖仓库根目录的 pgyvpn-ci.tar.gz）'
        type: boolean
        default: true
      proxy:
        description: '科学上网插件组合（默认不集成；SS 为总开关，选“无”后相关插件全部不集成）'
        type: choice
        required: true
        default: '无'
        options:
          - '无'
          - 'SS+SSOBFS'
          - 'SS+SSOBFS+Xray'
          - 'SS+SSOBFS+V2Ray'
          - 'SS+SSOBFS+Trojan'
          - '全家桶(SS+SSOBFS+Xray+V2Ray+Trojan)'
      adblock:
        description: '广告过滤'
        type: choice
        required: true
        default: '无'
        options:
          - '无'
          - 'adbyby'
          - 'koolproxy'
          - 'adguardhome'
      frp:
        description: '内网穿透 frp'
        type: choice
        required: true
        default: '无'
        options:
          - '无'
          - 'frpc'
          - 'frps'
          - 'frpc+frps'
      tools:
        description: '附加命令行工具'
        type: choice
        required: true
        default: '保持机型默认'
        options:
          - '保持机型默认'
          - '常用工具(htop/nano/socat/tcpdump/mtr)'
          - '全部工具(+iperf3/lrzsz/parted)'
      zerotier:
        description: '集成 ZeroTier（约 1.3MB，源码编译较慢）'
        type: boolean
        default: false
      wireguard:
        description: '集成 WireGuard（wireguard-go，约 0.1MB）'
        type: boolean
        default: false
      smartdns:
        description: '集成 SmartDNS'
        type: boolean
        default: false
      extra:
        description: '额外开关，逗号/分号分隔，如 CONFIG_FIRMWARE_INCLUDE_TTYD=y'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.model }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    # 只允许仓库所有者本人触发，避免公开仓库被人白嫖算力
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      MODEL: ${{ inputs.model }}
      PGYVPN: ${{ inputs.pgyvpn }}
      PROXY: ${{ inputs.proxy }}
      ADBLOCK: ${{ inputs.adblock }}
      FRP: ${{ inputs.frp }}
      TOOLS: ${{ inputs.tools }}
      ZEROTIER: ${{ inputs.zerotier }}
      WIREGUARD: ${{ inputs.wireguard }}
      SMARTDNS: ${{ inputs.smartdns }}
      EXTRA: ${{ inputs.extra }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 注入蒲公英(pgyvpn) 插件
        run: |
          set -euo pipefail
          if [ "${PGYVPN}" != "true" ]; then
            echo "未选择蒲公英，跳过注入"; exit 0
          fi
          TARBALL="${GITHUB_WORKSPACE}/pgyvpn-ci.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            echo "::error::仓库根目录缺少 pgyvpn-ci.tar.gz，请把它和 workflow 一起提交（不要解压）"
            exit 1
          fi
          rm -rf /tmp/pgyvpn_ci && mkdir -p /tmp/pgyvpn_ci
          tar -xzf "$TARBALL" -C /tmp/pgyvpn_ci
          # apply.sh 幂等：铺 trunk/user/pgyvpn、改 user/Makefile / build_firmware_modify /
          # dev_init.sh，并把蒲公英挂到「穿透服务」组
          sh /tmp/pgyvpn_ci/pgyvpn_ci/apply.sh "${GITHUB_WORKSPACE}"
          echo "---- 补丁是否落位 ----"
          grep -n "CONFIG_FIRMWARE_INCLUDE_PGYVPN" trunk/user/Makefile
          grep -n "pgyvpn_boot.sh" trunk/user/scripts/dev_init.sh | head -2
          find trunk/user/pgyvpn/payload -type f | wc -l

      - name: 菜单加固：蒲公英与 ZeroTier 同挂「穿透服务」组（组索引运行时探测）
        run: |
          set -euo pipefail
          if [ "${PGYVPN}" != "true" ]; then
            echo "未集成蒲公英，跳过菜单加固"; exit 0
          fi
          python3 - <<'PY'
          import glob, io, sys

          targets = sorted(glob.glob('trunk/user/www/*/state.js'))
          if not targets:
              print('::error::找不到 trunk/user/www/*/state.js')
              sys.exit(1)

          NEW = '''/* pgyvpn + zerotier：挂到「穿透服务」组（组索引/二级菜单槽 全部运行时探测） */
          function pgy_find_group(){
          	var probes = ["Advanced_zerotier.asp", "Advanced_aliddns.asp", "pgyvpn.asp"];
          	var i, j, k;
          	for (i = 0; i < probes.length; i++) {
          		for (j = 1; j < tablink.length; j++) {
          			if (typeof tablink[j] == "undefined" || !tablink[j]) continue;
          			for (k = 1; k < tablink[j].length; k++)
          				if (tablink[j][k] == probes[i]) return j;
          		}
          	}
          	for (j = 1; j < tabtitle.length; j++)
          		if (tabtitle[j] && tabtitle[j].length > 1 && tabtitle[j][1] == "<#menu5_30#>") return j;
          	return 16;
          }
          function pgy_group_add(G, link, title){
          	var k;
          	for (k = 1; k < tablink[G].length; k++)
          		if (tablink[G][k] == link) return;
          	if (title) tabtitle[G].push(title);
          	tablink[G].push(link);
          }
          function pgy_menu_attach(){
          	var i, G, L2;
          	/* 3.4 系「穿透服务」总开关(w_ss)关掉时整组不挂 */
          	if (typeof w_ss != "undefined" && w_ss == '0') return;
          	if (typeof tablink == "undefined" || typeof tabtitle == "undefined") return;
          	G = pgy_find_group();
          	if (typeof tabtitle[G] == "undefined" || !tabtitle[G] || tabtitle[G].length == 0) tabtitle[G] = new Array("");
          	if (typeof tablink[G]  == "undefined" || !tablink[G]  || tablink[G].length == 0)  tablink[G]  = new Array("");
          	/* 3.4 系 aliddns/zerotier 是 else-if 老写法，aliddns 会把 zerotier 页顶掉：
          	   这里把 zerotier 页补回同一个组，保证蒲公英和 zerotier 并列 */
          	if (typeof found_app_zerotier == "function" && found_app_zerotier())
          		pgy_group_add(G, "Advanced_zerotier.asp", "<#menu5_32#>");
          	pgy_group_add(G, "pgyvpn.asp", "蒲公英");
          	/* 二级菜单：有现成槽位指向本组就复用，没有才在末尾补「穿透服务」入口 */
          	L2 = -1;
          	for (i = 1; i < menuL2_link.length; i++)
          		if (menuL2_link[i] == tablink[G][1]) { L2 = i; break; }
          	if (L2 < 0) {
          		menuL2_title.push("<#menu5_30#>");
          		menuL2_link.push(tablink[G][1]);
          	}
          }
          pgy_menu_attach();
          /* end pgyvpn menu */'''

          for path in targets:
              with io.open(path, encoding='utf-8', errors='replace') as f:
                  s = f.read()
              start = s.find('/* pgyvpn: attach')
              if start < 0:
                  start = s.find('/* pgyvpn + zerotier')
              if start < 0:
                  print('::error::%s 里没有蒲公英注入块，apply.sh 可能没跑' % path)
                  sys.exit(1)
              end = s.find('/* end pgyvpn menu */')
              if end < 0:
                  print('::error::%s 里注入块没有结束标记' % path)
                  sys.exit(1)
              end += len('/* end pgyvpn menu */')
              s = s[:start] + NEW + s[end:]
              with io.open(path, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(s)
              print('已加固: %s' % path)
          PY
          echo "---- 加固后的注入块 ----"
          sed -n '/pgyvpn + zerotier/,/end pgyvpn menu/p' trunk/user/www/*/state.js | head -20
          grep -c 'menu5_30' trunk/user/www/*/state.js

      - name: 按底稿机型派生板级文件与模板
        run: |
          set -euo pipefail
          cd trunk

          # 机型派生表：左边是要编的机型，右边是当底稿的机型。
          # 目前表是空的 —— HC5661 走仓库自带配置（它本身就是 MT7620A / 128MB RAM /
          # 单频 2.4G 的配置，board.h 里的 GPIO 12/9/11 也是照 DTS 写的，不需要再派生）。
          # ⚠ 底稿的 SoC 必须和目标机型一致：HC5661A 是 MT7628 + 4.1 驱动，拿它当
          #    HC5661(MT7620A) 的底稿会编出开不了机的固件；真要派生就挑 MT7620A 的机型。
          # 例：HC5661) BASE="MI-MINI" ;;
          BASE=""
          case "$MODEL" in
            HC5661) ;;      # 用仓库自带（MT7620A），不派生
          esac

          if [ -z "$BASE" ]; then
            echo "机型 $MODEL 用仓库自带配置，不需要派生"
            echo "DERIVED_FROM=" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "== $MODEL 以 $BASE 为底稿重做板级文件与模板"
          [ -d "configs/boards/$BASE" ] || { echo "::error::底稿板级目录 configs/boards/$BASE 不存在"; exit 1; }
          [ -f "configs/templates/$BASE.config" ] || { echo "::error::底稿模板 configs/templates/$BASE.config 不存在"; exit 1; }

          # 1) 板级文件：整个目录换成底稿那一套（顺手丢掉仓库里 HC5661 目录下的杂文件），
          #    再把产品标识改成目标机型
          rm -rf "configs/boards/$MODEL"
          cp -a "configs/boards/$BASE" "configs/boards/$MODEL"
          sed -i "s/$BASE/$MODEL/g" "configs/boards/$MODEL/board.h" "configs/boards/$MODEL/board.mk"

          # 2) 模板：复制底稿模板，只改 PRODUCT_ID；
          #    CONFIG_PRODUCT / 无线驱动等保持底稿（SoC 必须和目标机型一致）
          cp -f "configs/templates/$BASE.config" "configs/templates/$MODEL.config"
          sed -i "s/^CONFIG_FIRMWARE_PRODUCT_ID=.*/CONFIG_FIRMWARE_PRODUCT_ID=\"$MODEL\"/" "configs/templates/$MODEL.config"

          # 3) 打印派生结果，方便核对
          echo "---- 板级文件 ----"
          ls "configs/boards/$MODEL"
          grep -nE 'BOARD_PID|BOARD_NAME|BOARD_DESC' "configs/boards/$MODEL/board.h"
          grep -n 'DBOARD_' "configs/boards/$MODEL/board.mk"
          echo "---- 模板关键项 ----"
          grep -nE '^CONFIG_PRODUCT=|^CONFIG_FIRMWARE_PRODUCT_ID=|^CONFIG_FIRMWARE_WIFI2_DRIVER=' "configs/templates/$MODEL.config"

          echo "DERIVED_FROM=$BASE" >> "$GITHUB_ENV"

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git unzip zip wget curl xz-utils bzip2 rsync bc \
            libtool-bin gperf gawk flex bison autopoint gettext automake \
            cpio fakeroot p7zip-full pkg-config texinfo help2man \
            python3 python3-docutils zlib1g-dev libltdl-dev libncurses-dev \
            libgmp-dev libmpc-dev libmpfr-dev libelf-dev device-tree-compiler

      - name: 下载 mipsel 预编译工具链
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
          ls -d toolchain-3.4.x
          ls toolchain-3.4.x/bin | head -5
          cc="$(ls toolchain-3.4.x/bin/*-gcc 2>/dev/null | head -1)"
          if [ -n "$cc" ]; then "$cc" --version | head -1; else echo "::error::工具链里没找到 gcc"; exit 1; fi

      - name: 生成 .config（机型 + 插件选择）
        run: |
          set -euo pipefail
          cd trunk

          if [ ! -f "configs/templates/${MODEL}.config" ]; then
            echo "::error::没有该机型配置：configs/templates/${MODEL}.config"
            ls configs/templates | sed 's/\.config$//' | tr '\n' ' '
            exit 1
          fi
          cp -f "configs/templates/${MODEL}.config" .config

          # 幂等写入：同名项先删再追加（.config 里后出现的赋值生效）
          set_opt() {
            sed -i "/^CONFIG_FIRMWARE_INCLUDE_$1=/d" .config
            printf 'CONFIG_FIRMWARE_INCLUDE_%s=%s\n' "$1" "$2" >> .config
          }

          # 1) 先把所有可选插件统一清零，保证结果只取决于本次选择，
          #    不受各机型模板里的历史默认值影响
          for k in PGYVPN SHADOWSOCKS XRAY V2RAY TROJAN SSOBFS SSSERVER \
                   ADBYBY KOOLPROXY ADGUARDHOME SMARTDNS \
                   ZEROTIER WIREGUARD FRPC FRPS \
                   ALIDDNS CADDY CADDYBIN WYY WYYBIN \
                   TTYD NVPPROXY SSWAN XFRM \
                   DNSFORWARDER MENTOHUST SCUTCLIENT SRELAY \
                   OPENSSL_EXE; do
            set_opt "$k" n
          done

          # 2) 蒲公英（必须先打好补丁，否则写进 .config 也不会进固件）
          if [ "${PGYVPN}" = "true" ]; then
            grep -q 'CONFIG_FIRMWARE_INCLUDE_PGYVPN' user/Makefile || {
              echo "::error::蒲公英补丁没打上：user/Makefile 里找不到 CONFIG_FIRMWARE_INCLUDE_PGYVPN"
              exit 1
            }
            [ -d user/pgyvpn/payload ] || { echo "::error::trunk/user/pgyvpn 不存在"; exit 1; }
            set_opt PGYVPN y
          fi

          # 3) 科学上网
          case "$PROXY" in
            '无') ;;                                       # SS 总开关关闭
            'SS+SSOBFS')
              set_opt SHADOWSOCKS y; set_opt SSOBFS y ;;
            'SS+SSOBFS+Xray')
              set_opt SHADOWSOCKS y; set_opt SSOBFS y; set_opt XRAY y ;;
            'SS+SSOBFS+V2Ray')
              set_opt SHADOWSOCKS y; set_opt SSOBFS y; set_opt V2RAY y ;;
            'SS+SSOBFS+Trojan')
              set_opt SHADOWSOCKS y; set_opt SSOBFS y; set_opt TROJAN y ;;
            '全家桶'*)
              set_opt SHADOWSOCKS y; set_opt SSOBFS y
              set_opt XRAY y; set_opt V2RAY y; set_opt TROJAN y ;;
            *) echo "::error::未知 proxy 取值：$PROXY"; exit 1 ;;
          esac

          # 4) 广告过滤
          case "$ADBLOCK" in
            '无') ;;
            'adbyby') set_opt ADBYBY y ;;
            'koolproxy') set_opt KOOLPROXY y ;;
            'adguardhome') set_opt ADGUARDHOME y ;;
            *) echo "::error::未知 adblock 取值：$ADBLOCK"; exit 1 ;;
          esac

          # 5) 内网穿透
          case "$FRP" in
            '无') ;;
            'frpc') set_opt FRPC y ;;
            'frps') set_opt FRPS y ;;
            'frpc+frps') set_opt FRPC y; set_opt FRPS y ;;
            *) echo "::error::未知 frp 取值：$FRP"; exit 1 ;;
          esac

          # 6) 命令行工具（选“保持机型默认”则不动模板原样）
          case "$TOOLS" in
            '保持机型默认') ;;
            '常用工具'*)
              for k in HTOP NANO SOCAT TCPDUMP MTR; do set_opt "$k" y; done ;;
            '全部工具'*)
              for k in HTOP NANO SOCAT TCPDUMP MTR IPERF3 LRZSZ PARTED; do set_opt "$k" y; done ;;
            *) echo "::error::未知 tools 取值：$TOOLS"; exit 1 ;;
          esac

          # 7) 布尔开关
          for pair in "ZEROTIER:$ZEROTIER" "WIREGUARD:$WIREGUARD" "SMARTDNS:$SMARTDNS"; do
            k="${pair%%:*}"; v="${pair#*:}"
            if [ "$v" = "true" ]; then set_opt "$k" y; fi
          done

          # 8) 额外开关（做格式校验，防止把乱七八糟的内容塞进 .config）
          if [ -n "${EXTRA// /}" ]; then
            printf '%s' "$EXTRA" | tr ',; ' '\n\n\n' > /tmp/extra_opts.txt
            while IFS= read -r line; do
              line="$(printf '%s' "$line" | tr -d '[:space:]')"
              [ -z "$line" ] && continue
              if ! printf '%s' "$line" | grep -qE '^CONFIG_FIRMWARE_INCLUDE_[A-Za-z0-9_]+=[yn]$'; then
                echo "::error::extra 格式不对，应为 CONFIG_FIRMWARE_INCLUDE_XXX=y 或 =n：$line"
                exit 1
              fi
              k="$(printf '%s' "$line" | sed -E 's/^CONFIG_FIRMWARE_INCLUDE_([A-Za-z0-9_]+)=.*/\1/')"
              v="${line##*=}"
              set_opt "$k" "$v"
            done < /tmp/extra_opts.txt
          fi

          echo "==== 本次生效的功能项 ===="
          grep -E '^CONFIG_FIRMWARE_INCLUDE_.*=y$' .config | sort

      - name: 编译固件
        run: |
          set -o pipefail
          cd trunk
          PGY="n"; [ "${PGYVPN}" = "true" ] && PGY="y"
          echo "蒲公英开关：PGYVPN=${PGY}"
          sudo ./clear_tree 2>&1 | tail -5
          # 第二参数传 0：不再套用源码里写死的插件默认值，只按上面生成的 .config
          sudo PGYVPN="${PGY}" ./build_firmware_modify "${MODEL}" 0 > build.log 2>&1 || {
            echo "::error::编译失败，下面是日志尾部"
            tail -150 build.log
            exit 1
          }
          echo "==== 编译完成，日志尾部 ===="
          tail -25 build.log
          grep -iE "pgyvpn|size|too large|exceed" build.log | tail -10 || true
          ls -l images/ || true

      - name: 整理产物
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          trx=(trunk/images/*.trx)
          other=(trunk/images/*.bin trunk/images/*.img)
          if [ ${#trx[@]} -eq 0 ]; then
            echo "::error::没有生成 trx 文件"
            ls -l trunk/images/ || true
            exit 1
          fi
          for f in "${trx[@]}" "${other[@]}"; do
            cp -f "$f" out/
          done
          cp -f trunk/.config "out/.config-${MODEL}.txt"
          cd out
          md5sum *.trx | tee md5sum.txt
          echo "---- 产物大小 ----"
          ls -lh *.trx
          {
            echo "机型: ${MODEL}"
            echo "板级/模板底稿: ${DERIVED_FROM:-仓库自带}"
            echo "蒲公英 pgyvpn: ${PGYVPN}"
            echo "科学上网: ${PROXY}"
            echo "广告过滤: ${ADBLOCK}"
            echo "frp: ${FRP}"
            echo "工具: ${TOOLS}"
            echo "ZeroTier: ${ZEROTIER}  WireGuard: ${WIREGUARD}  SmartDNS: ${SMARTDNS}"
            echo "额外: ${EXTRA}"
            echo "commit: ${GITHUB_SHA}"
          } > "选择说明.txt"

          # 体积提醒（只提示，不硬失败）
          size=$(stat -c %s *.trx | head -1)
          echo "trx 字节数: $size"
          if [ "$size" -gt 16777216 ]; then
            echo "::warning::固件超过 16MB，多数 16MB flash 机型刷入会溢出，请减少插件"
          elif [ "$size" -gt 8388608 ]; then
            echo "::warning::固件超过 8MB，8MB flash 机型（MI-3/MI-MINI/PSG1218 等）会刷不进或起不来"
          fi

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-${{ inputs.model }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.model }}-${{ github.run_number }}
          path: |
            trunk/build.log
          if-no-files-found: ignore

      - name: 写入任务摘要
        if: always()
        run: |
          {
            echo "### 云编译 keke-Padavan"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 机型 | ${MODEL} |"
            echo "| 板级/模板底稿 | ${DERIVED_FROM:-仓库自带} |"
            echo "| 蒲公英 pgyvpn | ${PGYVPN} |"
            echo "| 科学上网 | ${PROXY} |"
            echo "| 广告过滤 | ${ADBLOCK} |"
            echo "| frp | ${FRP} |"
            echo "| 工具 | ${TOOLS} |"
            echo "| ZeroTier / WireGuard | ${ZEROTIER} / ${WIREGUARD} |"
            echo "| SmartDNS | ${SMARTDNS} |"
            echo "| 额外开关 | ${EXTRA:-无} |"
            echo ""
            if ls out/*.trx >/dev/null 2>&1; then
              echo "**产物**"
              echo ""
              echo '```'
              ls -lh out/*.trx | awk '{print $5, $9}'
              cat out/md5sum.txt 2>/dev/null || true
              echo '```'
            else
              echo "**本次没有产出固件，请看 build-log 工件里的日志尾部。**"
            fi
            echo ""
            echo "> 刷机前确认 trx 大小不超过机型 flash 可用空间；默认 wifi: PDCN / PDCN_5G，密码 1234567890，管理地址 192.168.123.1。"
            echo "> 带蒲公英的固件，开机后菜单在「穿透服务」组；若没看到，到「系统管理 → 自定义菜单选项」把「穿透服务」总开关打开。"
          } >> "$GITHUB_STEP_SUMMARY"
